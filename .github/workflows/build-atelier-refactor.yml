name: Build Atelier static refactor
on:
  push:
    branches: [main]
    paths: [".github/workflows/build-atelier-refactor.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atelier-static-refactor
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/materialize-atelier.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atelier/app-static.html
          git commit -m "Materialize Atelier static application"
          git push origin HEAD:atelier-static-refactor
