name: Atelier checks
on:
  pull_request:
    paths:
      - "atelier/**"
      - "atelier-api/**"
      - ".github/workflows/atelier-v2-check.yml"
  push:
    branches: [main, atelier-v3-mobile-audit]
    paths:
      - "atelier/**"
      - "atelier-api/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check atelier/atelier.js
          node --check atelier/sw.js
      - name: FashionCLIP input-contract tests (no model download)
        run: |
          python3 -m unittest discover -s atelier/benchmarks/real-photos -p 'test_fashionclip_export.py'
          python3 -m unittest discover -s atelier/benchmarks/real-photos -p 'test_fashionclip_attributes.py'
      - name: Atelier release gate
        run: node atelier/validate.mjs
      - name: Security regression tests
        run: node atelier/security-test.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.56.1
          google-chrome --version
      - name: iPhone viewport browser smoke test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/atelier-http.log 2>&1 &
          node atelier/smoke-test.mjs
      - name: Install Safari engine
        run: npx playwright install --with-deps webkit
      - name: Safari WebKit browser test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/atelier-http.log 2>&1 &
          node atelier/webkit-v3-test.mjs
