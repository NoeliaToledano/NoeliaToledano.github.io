name: Atelier v2 checks
on:
  pull_request:
    paths:
      - "atelier/**"
      - ".github/workflows/atelier-v2-check.yml"
  push:
    branches: [atelier-full-repair]
    paths:
      - "atelier/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check atelier/app-v2.js
          node --check atelier/sw.js
      - name: Atelier release gate
        run: node atelier/validate-v2.mjs
