name: Materialize Atelier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atelier/index.html'
      - 'atelier/payload.js'
      - 'scripts/materialize-atelier.cjs'
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/materialize-atelier.cjs
      - name: Commit materialized app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atelier/app.html
          git diff --cached --quiet || git commit -m "Materialize Atelier static app"
          git push
