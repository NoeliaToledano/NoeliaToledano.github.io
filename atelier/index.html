<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<title>Atelier · Mi Armario</title>
<!-- redeploy: 2026-10-07 -->
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ec;color:#171717}
#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{max-width:420px;background:#fffdf9;padding:28px;border-radius:24px;box-shadow:0 10px 35px rgba(30,24,17,.08)}
small{color:#77716a}
</style>
</head>
<body>
<div id="loading"><div class="card"><h2>Atelier</h2><p>Cargando tu armario…</p><small>La primera carga puede tardar unos segundos.</small></div></div>
<script>
(async()=>{
  try{
    const names=["chunk00.txt","chunk01.txt","chunk02.txt","chunk03.txt","chunk04.txt","chunk05.txt"];
    const parts=await Promise.all(names.map(n=>fetch(n,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n);return r.text();})));
    const b64=parts.join("").trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    let html=await new Response(stream).text();

    const gateHtml=`
<div id="profileGate" class="profile-gate" hidden>
  <div class="profile-gate-card">
    <span class="eyebrow">ATELIER</span>
    <h1>¿Quién va a usar el armario?</h1>
    <p class="meta">Cada perfil tiene sus propias prendas, looks, favoritos, wishlist e historial.</p>
    <div id="profileChoices" class="profile-choices"></div>
    <div id="profilePasswordBox" class="profile-password-box" hidden>
      <button id="profileBackBtn" class="profile-back" type="button">← Volver</button>
      <div class="profile-selected" id="profileSelectedName"></div>
      <p id="profilePasswordHelp" class="meta"></p>
      <label for="profilePasswordInput">Contraseña</label>
      <div class="profile-password-row">
        <input id="profilePasswordInput" type="password" autocomplete="current-password" placeholder="Introduce la contraseña">
        <button id="profilePasswordToggle" type="button" aria-label="Mostrar contraseña">Ver</button>
      </div>
      <button id="profileUnlockBtn" class="profile-unlock" type="button">Entrar en el armario</button>
      <p id="profilePasswordError" class="profile-password-error" hidden></p>
    </div>
  </div>
</div>`;
    html=html.replace("<body>","<body>"+gateHtml);

    const profileCss=`
.profile-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:rgba(244,241,236,.96);backdrop-filter:blur(16px)}
.profile-gate[hidden]{display:none}
.profile-gate-card{width:min(100%,460px);background:#fffdf9;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 22px 70px rgba(30,24,17,.12)}
.profile-gate-card h1{margin:6px 0 8px}.profile-choices{display:grid;gap:12px;margin-top:20px}
.profile-choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}
.profile-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#171717;color:#fff;font-weight:800;flex:0 0 auto}
.profile-choice strong{display:block}.profile-choice small{display:block;color:var(--muted);margin-top:2px}
.profile-switch-button{position:fixed;top:14px;right:14px;z-index:80;border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:6px 10px 6px 6px;display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.profile-switch-button .pi{width:28px;height:28px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-size:12px}
.profile-password-box{margin-top:18px}.profile-password-box[hidden]{display:none}
.profile-back{border:0;background:transparent;padding:0;margin-bottom:16px;font-weight:700;cursor:pointer}
.profile-selected{font-size:22px;font-weight:800;margin-bottom:8px}
.profile-password-box label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
.profile-password-row{display:flex;gap:8px}
.profile-password-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;background:#fff}
.profile-password-row button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 14px;font-weight:700}
.profile-unlock{width:100%;margin-top:12px;border:0;border-radius:14px;background:#171717;color:#fff;padding:14px 16px;font-weight:800;font:inherit}
.profile-password-error{color:#a22626;font-weight:700;font-size:13px;margin:10px 0 0}
`;
    html=html.replace("</style>",profileCss+"</style>");

    html=html.replace("<main",'<button class="profile-switch-button" id="profileSwitchBtn" type="button"><span class="pi" id="activeProfileInitial">N</span><span id="activeProfileName">Noelia</span></button><main');

    const profileJs=`
const PROFILES=[{id:"noelia",name:"Noelia"},{id:"ana-maria",name:"Ana María"},{id:"irene",name:"Irene"}];
let activeProfileId="";
let pendingProfileId="";
function profileStateKey(id){return "state:"+id}
function passwordKey(id){return "atelier-profile-password:"+id}
function getActiveProfile(){return PROFILES.find(p=>p.id===activeProfileId)||PROFILES[0]}
async function hashPassword(value){
  const bytes=new TextEncoder().encode(value);
  const digest=await crypto.subtle.digest("SHA-256",bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function updateProfileUI(){const p=getActiveProfile();const n=document.getElementById("activeProfileName"),i=document.getElementById("activeProfileInitial");if(n)n.textContent=p.name;if(i)i.textContent=(p.name[0]||"?").toUpperCase()}
function resetPasswordView(){pendingProfileId="";const box=document.getElementById("profilePasswordBox"),choices=document.getElementById("profileChoices"),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError");if(box)box.hidden=true;if(choices)choices.hidden=false;if(input){input.value="";input.type="password"}if(err)err.hidden=true}
function renderProfileChoices(){const w=document.getElementById("profileChoices");if(!w)return;w.hidden=false;w.innerHTML=PROFILES.map(p=>'<button type="button" class="profile-choice" data-profile="'+p.id+'"><span class="profile-avatar">'+p.name[0].toUpperCase()+'</span><span><strong>'+p.name+'</strong><small>Armario privado de '+p.name+'</small></span></button>').join("");w.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>requestProfilePassword(b.dataset.profile)))}
function showProfileGate(){resetPasswordView();renderProfileChoices();document.getElementById("profileGate")?.removeAttribute("hidden")}
function requestProfilePassword(id){const p=PROFILES.find(x=>x.id===id);if(!p)return;pendingProfileId=id;const choices=document.getElementById("profileChoices"),box=document.getElementById("profilePasswordBox"),name=document.getElementById("profileSelectedName"),input=document.getElementById("profilePasswordInput"),help=document.getElementById("profilePasswordHelp"),btn=document.getElementById("profileUnlockBtn"),err=document.getElementById("profilePasswordError");const configured=!!localStorage.getItem(passwordKey(id));if(choices)choices.hidden=true;if(box)box.hidden=false;if(name)name.textContent=p.name;if(help)help.textContent=configured?"Introduce la contraseña para acceder.":"Primera vez en este dispositivo: crea la contraseña de este perfil.";if(btn)btn.textContent=configured?"Entrar en el armario":"Guardar contraseña y entrar";if(err)err.hidden=true;if(input){input.value="";setTimeout(()=>input.focus(),50)}}
async function unlockProfile(){const p=PROFILES.find(x=>x.id===pendingProfileId),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError");if(!p||!input)return;const value=input.value;if(value.length<4){if(err){err.textContent="La contraseña debe tener al menos 4 caracteres.";err.hidden=false}return}const entered=await hashPassword(value);const key=passwordKey(p.id),saved=localStorage.getItem(key);if(saved&&saved!==entered){if(err){err.textContent="Contraseña incorrecta.";err.hidden=false}input.select();return}if(!saved)localStorage.setItem(key,entered);activeProfileId=p.id;state=await loadStateAsync();updateProfileUI();document.getElementById("profileGate")?.setAttribute("hidden","");input.value="";renderAll();renderWishlistSaved();renderAnalytics();try{renderSavedOutfits()}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest("#profileSwitchBtn"))showProfileGate();if(e.target.closest("#profileBackBtn"))resetPasswordView();if(e.target.closest("#profileUnlockBtn"))unlockProfile();if(e.target.closest("#profilePasswordToggle")){const i=document.getElementById("profilePasswordInput");if(i){i.type=i.type==="password"?"text":"password";e.target.textContent=i.type==="password"?"Ver":"Ocultar"}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement?.id==="profilePasswordInput")unlockProfile()});
`;
    html=html.replace('const DB_NAME = "atelier-armario-db";',profileJs+'const DB_NAME = "atelier-armario-db";');
    html=html.replace('idbGet("state")','idbGet(profileStateKey(activeProfileId))');
    html=html.replaceAll('idbSet("state",state)','idbSet(profileStateKey(activeProfileId),state)');
    html=html.replace('const legacy=localStorage.getItem(STORAGE_KEY);','const legacy=(activeProfileId==="noelia")?localStorage.getItem(STORAGE_KEY):null;');
    html=html.replace('idbSet("state",migrated)','idbSet(profileStateKey(activeProfileId),migrated)');

    html=html.replace(
`async function bootstrapApp(){
  state = await loadStateAsync();
  renderAll();
  renderWishlistSaved();
  renderAnalytics();
}`,
`async function bootstrapApp(){
  renderProfileChoices();
  showProfileGate();
}`
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById("loading").innerHTML='<div class="card"><h2>No he podido abrir Atelier</h2><p>Recarga la página. Si sigue ocurriendo, falta alguno de los archivos de la aplicación.</p></div>';
  }
})();
</script>
</body>
</html>
