<div id="loading">
  <div class="card instant-profile-card">

    <div id="preprofileSelected" class="instant-password" hidden>
      <button id="preprofileBack" class="instant-back" type="button">← Cambiar perfil</button>

      <div class="instant-password-row"><input id="preprofilePassword" type="password" autocomplete="current-password" placeholder="Introduce la contraseña"><button id="preprofileToggle" type="button" aria-label="Mostrar contraseña">Ver</button></div>

<script>
const ATELIER_DEBUG=true;
window.__atelierDebugLog=[];
function atelierDebug(stage,data){
  if(!ATELIER_DEBUG)return;
  const row={t:Math.round(performance.now()),stage,data:data==null?"":String(data)};
  window.__atelierDebugLog.push(row);
  try{localStorage.setItem("atelier-debug-log",JSON.stringify(window.__atelierDebugLog.slice(-120)))}catch(_){}
  console.log("[ATELIER]",row.t,stage,row.data);
  const box=document.getElementById("atelierDebug");
  if(box){box.style.display="block";box.textContent=window.__atelierDebugLog.map(x=>x.t+"ms  "+x.stage+(x.data?"  "+x.data:"")).join("\\n");box.scrollTop=box.scrollHeight}
}
window.addEventListener("error",e=>atelierDebug("WINDOW_ERROR",(e.message||"error")+" @ "+(e.filename||"")+":"+(e.lineno||"")));
window.addEventListener("unhandledrejection",e=>atelierDebug("PROMISE_REJECTION",e.reason?.stack||e.reason?.message||e.reason||"unknown"));
atelierDebug("BOOT","prelogin script running");
window.__atelierPreselectedProfile="";
window.__atelierPendingPassword="";
window.__atelierPreAuthToken="";
window.__atelierPreAuthProfile="";

function atelierTogglePassword(){
  const input=document.getElementById("preprofilePassword");
  const btn=document.getElementById("preprofileToggle");
  if(!input||!btn)return;
  const reveal=input.type==="password";
  input.type=reveal?"text":"password";
  btn.textContent=reveal?"Ocultar":"Ver";
  btn.setAttribute("aria-label",reveal?"Ocultar contraseña":"Mostrar contraseña");
}
function atelierBackToProfiles(){
  window.__atelierPreselectedProfile="";
  window.__atelierPendingPassword="";
  const list=document.querySelector(".instant-profile-list");
  const selected=document.getElementById("preprofileSelected");
  const input=document.getElementById("preprofilePassword");
  const error=document.getElementById("preprofileError");
  if(list){list.hidden=false;list.style.display="grid"}
  if(selected){selected.hidden=true;selected.style.display="none"}
  if(input){input.value="";input.type="password"}
  if(error)error.hidden=true;
}
function atelierPickProfile(btn){
  window.__atelierPreselectedProfile=btn.dataset.preprofile||"";
  const list=document.querySelector(".instant-profile-list");
  const selected=document.getElementById("preprofileSelected");
  const name=document.getElementById("preprofileSelectedName");
  const input=document.getElementById("preprofilePassword");
  const error=document.getElementById("preprofileError");
  if(list){list.hidden=true;list.style.display="none"}
  if(selected){selected.hidden=false;selected.style.display="grid"}
  if(name)name.textContent=btn.querySelector("strong")?.textContent||"Perfil";
  if(error)error.hidden=true;
  if(input){input.value="";input.type="password";setTimeout(()=>input.focus(),10)}
}
async function atelierPreEnter(){
  const input=document.getElementById("preprofilePassword");
  const error=document.getElementById("preprofileError");
  const btn=document.getElementById("preprofileEnter");
  const profileId=window.__atelierPreselectedProfile||"";
  const password=input?.value||"";
  if(!profileId){if(error){error.textContent="Selecciona un perfil.";error.hidden=false}return}
  if(!password){if(error){error.textContent="Introduce la contraseña.";error.hidden=false}return}
  if(error)error.hidden=true;
  if(btn){btn.disabled=true;btn.textContent="Entrando…"}
  atelierDebug("LOGIN_START",profileId);
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),12000);
  let response,data;
  try{
    response=await fetch("https://atelier-ai-backend-pi.vercel.app/api/login",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({profileId,password}),signal:ctrl.signal
    });
    data=await response.json().catch(()=>({}));
  }catch(ex){
    clearTimeout(timer);
    if(error){error.textContent=ex?.name==="AbortError"?"Atelier está tardando demasiado en responder.":"No se puede contactar con el servidor de acceso.";error.hidden=false}
    if(btn){btn.disabled=false;btn.textContent="Entrar en el armario"}
    return;
  }
  clearTimeout(timer);
  if(!response.ok){
    if(error){error.textContent=data.error||("Error de acceso ("+response.status+").");error.hidden=false}
    if(btn){btn.disabled=false;btn.textContent="Entrar en el armario"}
    return;
  }
  atelierDebug("LOGIN_OK",profileId);
  window.__atelierPendingPassword=password;
  window.__atelierPreAuthToken=data.token||"";
  window.__atelierPreAuthProfile=profileId;
  if(btn)btn.textContent="Abriendo Atelier…";
  try{
    await window.__atelierPreparePromise;
    if(!atelierInstallPreparedApp())throw new Error("APP_NOT_READY");
  }catch(ex){
    if(error){error.textContent="El acceso es correcto, pero la aplicación no ha podido cargarse"+(window.__atelierPrepareError?.message?" ("+window.__atelierPrepareError.message+")":"")+". ";error.hidden=false}
    if(btn){btn.disabled=false;btn.textContent="Entrar en el armario"}
  }
}
document.getElementById("preprofileToggle")?.addEventListener("click",atelierTogglePassword);
document.getElementById("preprofileBack")?.addEventListener("click",atelierBackToProfiles);
document.getElementById("preprofileEnter")?.addEventListener("click",atelierPreEnter);
document.querySelectorAll("[data-preprofile]").forEach(btn=>btn.addEventListener("click",()=>atelierPickProfile(btn)));
document.getElementById("preprofilePassword")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();atelierPreEnter()}});
</script>
