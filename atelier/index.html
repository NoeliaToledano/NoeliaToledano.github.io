<script>
window.__atelierPreselectedProfile="";
document.addEventListener("click",function(e){
  const toggle=e.target.closest("#preprofileToggle");
  if(toggle){const i=document.getElementById("preprofilePassword");if(i){i.type=i.type==="password"?"text":"password";toggle.textContent=i.type==="password"?"Ver":"Ocultar"}return}
  const enter=e.target.closest("#preprofileEnter");
  if(enter){window.__atelierPendingPassword=document.getElementById("preprofilePassword")?.value||"";const er=document.getElementById("preprofileError");if(!window.__atelierPendingPassword){if(er){er.textContent="Introduce la contraseña.";er.hidden=false}}else{enter.disabled=true;enter.textContent="Entrando…"}return}
  const back=e.target.closest("#preprofileBack");
  if(back){
    window.__atelierPreselectedProfile="";
    const list=document.querySelector(".instant-profile-list");
    const selected=document.getElementById("preprofileSelected");
    const s=document.getElementById("preloadStatus");
    if(list)list.hidden=false;
    if(selected)selected.hidden=true;
    if(s)s.textContent="";
    return;
  }
  const b=e.target.closest("[data-preprofile]");
  if(!b)return;
  window.__atelierPreselectedProfile=b.dataset.preprofile||"";
  const list=document.querySelector(".instant-profile-list");
  const selected=document.getElementById("preprofileSelected");
  const selectedName=document.getElementById("preprofileSelectedName");
  const label=b.querySelector("strong")?.textContent||"Perfil";
  if(list)list.hidden=true;
  if(selected)selected.hidden=false;
  if(selectedName)selectedName.textContent=label;
  const inp=document.getElementById("preprofilePassword");if(inp){inp.value="";setTimeout(()=>inp.focus(),0)}
  const er=document.getElementById("preprofileError");if(er)er.hidden=true;
  const s=document.getElementById("preloadStatus");
  if(s)s.textContent="";
});
(async()=>{
  try{
    const names=["chunk00.txt","chunk01.txt","chunk02.txt","chunk03.txt","chunk04.txt","chunk05.txt"];
    const parts=await Promise.all(names.map(n=>fetch(n,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error(n);return r.text();})));
    const b64=parts.join("").trim();

    if(status)status.textContent="";
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));

    const gateHtml=`

    const profileCss=`
.profile-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:rgba(244,241,236,.96);backdrop-filter:blur(16px)}

.profile-password-box{margin-top:18px}.profile-password-box[hidden]{display:none}.profile-choices[hidden]{display:none!important}

    html=html.replace("</style>",profileCss+"</style>");

    html=html.replace("<main",'<button class="profile-switch-button" id="profileSwitchBtn" type="button"><span class="pi" id="activeProfileInitial">N</span><span id="activeProfileName">Noelia</span></button><main');

    const profileJs=`
const ATELIER_API_BASE="https://atelier-ai-backend-pi.vercel.app";
const PROFILES=[{id:"noelia",name:"Noelia"},{id:"ana-maria",name:"Ana María"},{id:"irene",name:"Irene"}];
let activeProfileId="";
let pendingProfileId="";
let atelierSessionToken="";
let lastActivityAt=Date.now();
let backgroundAt=0;
const AUTO_LOCK_MS=10*60*1000;
const BACKGROUND_LOCK_MS=60*1000;

function profileStateKey(id){return "state:"+id}
function getActiveProfile(){return PROFILES.find(p=>p.id===activeProfileId)||PROFILES[0]}
function updateProfileUI(){
  const p=getActiveProfile(),n=document.getElementById("activeProfileName"),i=document.getElementById("activeProfileInitial");
  if(n)n.textContent=p.name;if(i)i.textContent=(p.name[0]||"?").toUpperCase()
}
function resetPasswordView(){
  pendingProfileId="";
  const box=document.getElementById("profilePasswordBox"),choices=document.getElementById("profileChoices"),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError");
  if(box){box.hidden=true;box.style.display="none"}if(choices){choices.hidden=false;choices.style.display="grid"}
  if(input){input.value="";input.type="password";input.disabled=false}
  if(err)err.hidden=true
}
function renderProfileChoices(){
  const w=document.getElementById("profileChoices");if(!w)return;
  w.hidden=false;
  w.innerHTML=PROFILES.map(p=>'<button type="button" class="profile-choice" data-profile="'+p.id+'"><span class="profile-avatar">'+p.name[0].toUpperCase()+'</span><span><strong>'+p.name+'</strong><small>Armario privado de '+p.name+'</small></span></button>').join("");
  w.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>requestProfilePassword(b.dataset.profile)))
}
function showProfileGate(){
  activeProfileId="";
  atelierSessionToken="";
  resetPasswordView();renderProfileChoices();
  document.getElementById("profileGate")?.removeAttribute("hidden")
}
function lockAtelier(){
  atelierSessionToken="";
  activeProfileId="";
  showProfileGate()
}
function requestProfilePassword(id){
  const p=PROFILES.find(x=>x.id===id);if(!p)return;
  pendingProfileId=id;
  const choices=document.getElementById("profileChoices"),box=document.getElementById("profilePasswordBox"),name=document.getElementById("profileSelectedName"),input=document.getElementById("profilePasswordInput"),help=document.getElementById("profilePasswordHelp"),btn=document.getElementById("profileUnlockBtn"),err=document.getElementById("profilePasswordError");
  if(choices){choices.hidden=true;choices.style.display="none"}if(box){box.hidden=false;box.style.display="block"}if(name)name.textContent=p.name;
  if(help)help.textContent="Introduce la contraseña para acceder.";
  if(btn){btn.textContent="Entrar en el armario";btn.disabled=false}
  if(err)err.hidden=true;
  if(input){input.value="";input.disabled=false;setTimeout(()=>input.focus(),50)}
}
async function unlockProfile(){
  const p=PROFILES.find(x=>x.id===pendingProfileId),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError"),btn=document.getElementById("profileUnlockBtn");
  if(!p||!input)return;
  if(!input.value){if(err){err.textContent="Introduce la contraseña.";err.hidden=false}return}
  if(btn)btn.disabled=true;
  try{
    const response=await fetch(ATELIER_API_BASE+"/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({profileId:p.id,password:input.value})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok){
      if(err){err.textContent=data.error||"No se ha podido iniciar sesión.";err.hidden=false}
      input.value="";input.focus();return;
    }
    atelierSessionToken=data.token;
    activeProfileId=p.id;
    lastActivityAt=Date.now();
    state=await loadStateAsync();updateProfileUI();
    document.getElementById("profileGate")?.setAttribute("hidden","");
    input.value="";
    renderAll();renderWishlistSaved();renderAnalytics();try{renderSavedOutfits()}catch(e){}
  }catch(ex){
    if(err){err.textContent="No puedo conectar con el servidor de Atelier. Inténtalo de nuevo.";err.hidden=false}
  }finally{if(btn)btn.disabled=false}
}
async function atelierAuthedFetch(path,options={}){
  if(!atelierSessionToken)throw new Error("NO_SESSION");
  const headers=new Headers(options.headers||{});
  headers.set("Authorization","Bearer "+atelierSessionToken);
  return fetch(ATELIER_API_BASE+path,{...options,headers});
}

["pointerdown","touchstart","keydown","scroll"].forEach(evt=>document.addEventListener(evt,()=>{lastActivityAt=Date.now()},{passive:true}));
setInterval(()=>{if(activeProfileId&&Date.now()-lastActivityAt>AUTO_LOCK_MS)lockAtelier()},30000);
