window.__atelierPreselectedProfile="";
document.addEventListener("click",function(e){
  const back=e.target.closest("#preprofileBack");
  if(back){
    window.__atelierPreselectedProfile="";
    const list=document.querySelector(".instant-profile-list");
    const selected=document.getElementById("preprofileSelected");
    const s=document.getElementById("preloadStatus");
    if(list)list.hidden=false;
    if(selected)selected.hidden=true;
    if(s)s.textContent="Cargando Atelier en segundo plano…";
    return;
  }
  const b=e.target.closest("[data-preprofile]");
  if(!b)return;
  window.__atelierPreselectedProfile=b.dataset.preprofile||"";
  const list=document.querySelector(".instant-profile-list");
  const selected=document.getElementById("preprofileSelected");
  const selectedName=document.getElementById("preprofileSelectedName");
  const label=b.querySelector("strong")?.textContent||"Perfil";
  if(list)list.hidden=true;
  if(selected)selected.hidden=false;
  if(selectedName)selectedName.textContent=label;
  const s=document.getElementById("preloadStatus");
  if(s)s.textContent="Perfil seleccionado. Terminando de cargar…";
});

function profileStateKey(id){return "state:"+id}

function updateProfileUI(){
  const p=getActiveProfile(),n=document.getElementById("activeProfileName"),i=document.getElementById("activeProfileInitial");

function resetPasswordView(){
  pendingProfileId="";
  const box=document.getElementById("profilePasswordBox"),choices=document.getElementById("profileChoices"),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError");
  if(box){box.hidden=true;box.style.display="none"}if(choices){choices.hidden=false;choices.style.display="grid"}

  const w=document.getElementById("profileChoices");if(!w)return;

function showProfileGate(){

function lockAtelier(){
  atelierSessionToken="";
  activeProfileId="";

}
function requestProfilePassword(id){
  const p=PROFILES.find(x=>x.id===id);if(!p)return;
  pendingProfileId=id;
  const choices=document.getElementById("profileChoices"),box=document.getElementById("profilePasswordBox"),name=document.getElementById("profileSelectedName"),input=document.getElementById("profilePasswordInput"),help=document.getElementById("profilePasswordHelp"),btn=document.getElementById("profileUnlockBtn"),err=document.getElementById("profilePasswordError");
  if(choices){choices.hidden=true;choices.style.display="none"}if(box){box.hidden=false;box.style.display="block"}if(name)name.textContent=p.name;
  if(help)help.textContent="Introduce la contraseña para acceder.";
  if(btn){btn.textContent="Entrar en el armario";btn.disabled=false}
  if(err)err.hidden=true;
  if(input){input.value="";input.disabled=false;setTimeout(()=>input.focus(),50)}
}
async function unlockProfile(){
  const p=PROFILES.find(x=>x.id===pendingProfileId),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError"),btn=document.getElementById("profileUnlockBtn");
  if(!p||!input)return;
  if(!input.value){if(err){err.textContent="Introduce la contraseña.";err.hidden=false}return}
  if(btn)btn.disabled=true;
  try{
    const response=await fetch(ATELIER_API_BASE+"/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({profileId:p.id,password:input.value})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok){
      if(err){err.textContent=data.error||"No se ha podido iniciar sesión.";err.hidden=false}
      input.value="";input.focus();return;
    }
    atelierSessionToken=data.token;
    activeProfileId=p.id;
    lastActivityAt=Date.now();
    state=await loadStateAsync();updateProfileUI();
    document.getElementById("profileGate")?.setAttribute("hidden","");
    input.value="";
    renderAll();renderWishlistSaved();renderAnalytics();try{renderSavedOutfits()}catch(e){}
  }catch(ex){
    if(err){err.textContent="No puedo conectar con el servidor de Atelier. Inténtalo de nuevo.";err.hidden=false}
  }finally{if(btn)btn.disabled=false}
}
async function atelierAuthedFetch(path,options={}){
  if(!atelierSessionToken)throw new Error("NO_SESSION");
  const headers=new Headers(options.headers||{});
  headers.set("Authorization","Bearer "+atelierSessionToken);
  return fetch(ATELIER_API_BASE+path,{...options,headers});
}

ithAI(){\n    const btn=document.getElementById(\"analyzePhotoBtn\"),status=document.getElementById(\"aiStatus\"),input=document.getElementById(\"photoInput\");\n    const file=input?.files?.[0];\n    if(!file){if(status)status.textContent=\"Primero añade una foto.\";return}\n    if(!window.atelierAuthedFetch&&typeof atelierAuthedFetch!==\"function\"){if(status)status.textContent=\"Vuelve a iniciar sesión.\";return}\n    if(btn){btn.disabled=true;btn.textContent=\"Analizando con IA…\"}\n    if(status)status.textContent=\"La IA está identificando la prenda y sus atributos…\";\n    try{\n      const image=await imageForAI(file);\n      const response=await atelierAuthedFetch(\"/api/analyze\",{\n        method:\"POST\",\n        headers:{\"Content-Type\":\"application/json\"},\n        body:JSON.stringify({image})\n      });\n      const data=await response.json().catch(()=>({}));\n      if(response.status===401){lockAtelier();throw new Error(\"Tu sesión ha caducado. Vuelve a entrar.\")}\n      if(!response.ok)throw new Error(data.error||\"No se ha podido analizar la prenda.\");\n      applyGarment(data.garment||{});\n      if(status)status.textContent=\"✓ IA completada. Revisa los campos y guarda la prenda.\";\n    }catch(err){\n      if(status)status.textContent=err.message||\"No se ha podido analizar la foto.\";\n    }finally{\n      if(btn){btn.disabled=!input?.files?.[0];btn.textContent=\"✦ Analizar foto con IA\"}\n    }\n  }\n  document.addEventListener(\"click\",function(e){\n    const btn=e.target.closest(\"#analyzePhotoBtn\");\n    if(!btn)return;\n    e.preventDefault();e.stopImmediatePropagation();analyzeWithAI();\n  },true);\n  document.addEventListener(\"change\",function(e){\n    if(e.target?.id===\"photoInput\"){\n      const btn=document.getElementById(\"analyzePhotoBtn\");\n      if(btn){btn.disabled=!e.target.files?.length;btn.textContent=\"✦ Analizar foto con IA\"}\n      const status=document.getElementById(\"aiStatus\");\n      if(status&&e.target.files?.length)status.textContent=\"Foto lista. Pulsa “Analizar foto con IA”.\";\n    }\n  },true);\n})();\n<\/script>"+"</body>");
