<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;self&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; data: blob:; connect-src https://atelier-ai-backend-pi.vercel.app https://api.open-meteo.com; manifest-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Atelier · Mi Armario</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./atelier.css">
<script src="./atelier.js" defer></script>
</head>
<body>
<section id="auth" class="auth">
  <div class="auth-card">
    <p class="auth-eyebrow">TU VESTIDOR PERSONAL <span>✦</span></p><h1>Atelier<span class="auth-dot">.</span></h1>
    <p class="auth-subtitle">Tu estilo empieza aquí.</p>
    <p class="auth-prompt">¿Quién va a vestirse hoy?</p>
    <div class="profiles">
      <button type="button" class="profile-option" data-profile="noelia" aria-pressed="false"><span class="profile-avatar" aria-hidden="true">N</span><span class="profile-label">Noelia</span><span class="profile-check" aria-hidden="true">✓</span></button>
      <button type="button" class="profile-option" data-profile="ana-maria" aria-pressed="false"><span class="profile-avatar" aria-hidden="true">A</span><span class="profile-label">Ana María</span><span class="profile-check" aria-hidden="true">✓</span></button>
      <button type="button" class="profile-option" data-profile="irene" aria-pressed="false"><span class="profile-avatar" aria-hidden="true">I</span><span class="profile-label">Irene</span><span class="profile-check" aria-hidden="true">✓</span></button>
      <button type="button" class="profile-option" data-profile="eva" aria-pressed="false"><span class="profile-avatar" aria-hidden="true">E</span><span class="profile-label">Eva</span><span class="profile-check" aria-hidden="true">✓</span></button>
      <button type="button" class="profile-option" data-profile="virginia" aria-pressed="false"><span class="profile-avatar" aria-hidden="true">V</span><span class="profile-label">Virginia</span><span class="profile-check" aria-hidden="true">✓</span></button>
    </div>
    <div id="passwordStep" class="hidden" aria-label="Acceso al perfil">
      <button type="button" id="backToProfiles" class="auth-back">← Volver a perfiles</button>
      <div class="auth-selected-profile"><span id="selectedProfileAvatar" class="profile-avatar" aria-hidden="true"></span><div><span class="auth-selected-caption">ENTRAR COMO</span><strong id="selectedProfileName"></strong></div></div>
      <div class="field auth-password-field"><label for="password">Tu contraseña</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Introduce tu contraseña"><button type="button" id="togglePassword" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div></div>
      <button id="loginBtn" class="primary auth-submit">Entrar a mi armario <span aria-hidden="true">→</span></button>
      <div id="authError" class="error" role="alert" aria-live="polite"></div>
    </div>
    <p class="auth-footnote">Un espacio para cada estilo. Solo vuestro.</p>
  </div>
</section>

<div id="app" class="hidden">
<header class="topbar"><div class="brand">Atelier</div><button id="profileName" class="profile-pill"></button></header>
<main id="content" class="content"></main>
<nav class="bottom-nav" aria-label="Navegación principal">
<button class="nav-btn active" data-view="wardrobe"><span>◇</span>Armario</button>
<button class="nav-btn" data-view="stylist"><span>✦</span>Estilista</button>
<button class="nav-btn" data-view="shopping"><span>♡</span>Compras</button>
<button class="nav-btn" data-view="insights"><span>▥</span>Análisis</button>
<button class="nav-btn" data-view="settings"><span>○</span>Ajustes</button>
</nav>
</div>

<div id="garmentSheet" class="overlay hidden">
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="garmentTitle">
<form id="garmentForm">
<div class="section-head"><h2 id="garmentTitle">Nueva prenda</h2><button type="button" id="closeGarment" class="secondary">Cerrar</button></div>
<input type="hidden" id="garmentId">
<div class="field"><span class="field-title">Foto de la prenda (obligatoria)</span><div class="photo-buttons"><button type="button" class="secondary" data-photo-pick="garmentCamera">📷 Hacer foto</button><button type="button" class="secondary" data-photo-pick="garmentImage">🖼️ Galería</button></div><input id="garmentImage" class="file-hidden" type="file" tabindex="-1" accept="image/*" aria-label="Elegir foto de la galería"><input id="garmentCamera" class="file-hidden" type="file" tabindex="-1" accept="image/*" capture="environment" aria-label="Hacer foto con la cámara"><img id="garmentPreview" class="garment-preview hidden" alt="Vista previa de la prenda"><button id="analyzeBtn" type="button" class="secondary">✨ Analizar foto</button></div>
<div class="field"><label for="garmentName">Nombre</label><input id="garmentName" maxlength="80" required></div>
<div class="field"><label for="garmentCategory">Categoría</label><select id="garmentCategory"><option value="">Sin categoría</option><option>Arriba</option><option>Abajo</option><option>Vestidos</option><option>Capas</option><option>Zapatos</option><option>Bolsos</option><option>Accesorios</option></select></div>
<div class="field"><label for="garmentColor">Color</label><input id="garmentColor" maxlength="60"></div>
<div class="field"><label for="garmentSeason">Temporada</label><select id="garmentSeason"><option value="all">Todo el año</option><option value="warm">Primavera / verano</option><option value="cold">Otoño / invierno</option></select></div>
<div class="field"><label for="garmentStyle">Estilo</label><select id="garmentStyle"><option value="">Sin definir</option><option value="casual">Casual</option><option value="smart">Arreglado</option><option value="party">Fiesta</option><option value="sport">Deporte</option></select></div>
<div class="field"><label for="garmentPrice">Precio de compra (€)</label><input id="garmentPrice" type="number" min="0" max="100000" step="0.01" inputmode="decimal"></div>
<div class="field"><label for="garmentBought">Fecha de compra (opcional)</label><input id="garmentBought" type="date"></div>
<label class="switch-line"><input type="checkbox" id="garmentFavorite"> Añadir a favoritos ♡</label>
<div class="field"><label for="garmentNotes">Notas</label><textarea id="garmentNotes" rows="3" maxlength="500"></textarea></div>
<div class="actions"><button id="deleteGarment" type="button" class="danger hidden">Eliminar</button><button type="submit" class="primary">Guardar</button></div>
</form>
</section>
</div>

<div id="lookSheet" class="overlay hidden">
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="lookTitle">
<form id="lookForm">
<div class="section-head"><h2 id="lookTitle">Nuevo look</h2><button type="button" id="closeLook" class="secondary">Cerrar</button></div>
<input type="hidden" id="lookId">
<div class="field"><label for="lookName">Nombre</label><input id="lookName" maxlength="80" required></div>
<div class="field"><label>Prendas</label><div id="lookGarments"></div></div>
<div class="field"><label for="lookOccasion">Ocasión</label><select id="lookOccasion"><option value="daily">Día a día</option><option value="work">Trabajo</option><option value="dinner">Cena</option><option value="event">Evento</option><option value="travel">Viaje</option></select></div>
<label class="switch-line"><input type="checkbox" id="lookFavorite"> Look favorito ♡</label>
<div class="actions"><button id="deleteLook" type="button" class="danger hidden">Eliminar</button><button type="submit" class="primary">Guardar look</button></div>
</form>
</section>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<noscript>Atelier necesita JavaScript para funcionar.</noscript>
</body>
</html>
