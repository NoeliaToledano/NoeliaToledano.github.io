<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<title>Atelier · Mi Armario</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles-v2.css">
</head>
<body>
<main id="app" class="hidden">
<header class="topbar"><div class="brand">Atelier</div><button class="profile-pill" id="profileName" type="button">Perfil</button></header>
<section class="content" id="content"></section>
<nav class="bottom-nav" aria-label="Navegación principal">
<button class="nav-btn active" data-view="wardrobe" type="button"><span>♢</span>Armario</button>
<button class="nav-btn" data-view="looks" type="button"><span>✦</span>Looks</button>
<button class="nav-btn" data-view="settings" type="button"><span>○</span>Ajustes</button>
</nav>
</main>
<section class="auth" id="auth" aria-label="Acceso a Atelier">
<div class="auth-card"><h1>Atelier</h1><p class="muted">Tu armario personal.</p>
<div class="profiles">
<button class="profile-option" data-profile="noelia" type="button">Noelia</button>
<button class="profile-option" data-profile="ana-maria" type="button">Ana María</button>
<button class="profile-option" data-profile="irene" type="button">Irene</button>
</div>
<div id="passwordStep" class="hidden"><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn" type="button">Entrar</button><div class="error" id="authError" role="alert"></div></div>
</div></section>
<section class="overlay hidden" id="garmentSheet"><div class="sheet"><h2 id="garmentTitle">Nueva prenda</h2>
<form id="garmentForm"><input type="hidden" id="garmentId"><div class="field"><label for="garmentImage">Foto</label><input id="garmentImage" type="file" accept="image/*"></div><button class="secondary" id="analyzeBtn" type="button">✨ Analizar foto</button>
<div class="field"><label for="garmentName">Nombre</label><input id="garmentName" maxlength="80"></div>
<div class="field"><label for="garmentCategory">Categoría</label><select id="garmentCategory"><option value="">Selecciona</option><option>Parte de arriba</option><option>Parte de abajo</option><option>Vestido</option><option>Calzado</option><option>Abrigo</option><option>Accesorio</option><option>Otro</option></select></div>
<div class="field"><label for="garmentColor">Color</label><input id="garmentColor" maxlength="60"></div><div class="field"><label for="garmentNotes">Notas</label><textarea id="garmentNotes" rows="3"></textarea></div>
<div class="actions"><button class="secondary" id="closeGarment" type="button">Cancelar</button><button class="primary" type="submit">Guardar</button></div><button class="danger hidden" id="deleteGarment" type="button">Eliminar prenda</button></form></div></section>
<section class="overlay hidden" id="lookSheet"><div class="sheet"><h2 id="lookTitle">Nuevo look</h2><form id="lookForm"><input type="hidden" id="lookId"><div class="field"><label for="lookName">Nombre</label><input id="lookName" maxlength="80"></div><div id="lookGarments"></div><div class="actions"><button class="secondary" id="closeLook" type="button">Cancelar</button><button class="primary" type="submit">Guardar</button></div><button class="danger hidden" id="deleteLook" type="button">Eliminar look</button></form></div></section>
<div class="toast hidden" id="toast" role="status"></div>
<script type="module" src="./app-v2.js"></script>
</body></html>
