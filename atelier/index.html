<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;self&#39;; style-src &#39;self&#39; &#39;unsafe-inline&#39;; img-src &#39;self&#39; data: blob:; connect-src https://atelier-ai-backend-pi.vercel.app; manifest-src &#39;self&#39;; object-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Atelier · Mi Armario</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles-v2.css">
<script src="./app-v2.js" defer></script>
<script src="./features-v3.js" defer></script>
</head>
<body>
<section id="auth" class="auth">
  <div class="auth-card">
    <p class="muted">MI ARMARIO</p><h1>Atelier</h1>
    <p class="muted">Elige tu perfil para entrar.</p>
    <div class="profiles">
      <button class="profile-option" data-profile="noelia">Noelia</button>
      <button class="profile-option" data-profile="ana-maria">Ana María</button>
      <button class="profile-option" data-profile="irene">Irene</button>
    </div>
    <div id="passwordStep" class="hidden">
      <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div>
      <button id="loginBtn" class="primary" style="width:100%">Entrar</button>
      <div id="authError" class="error" role="alert" aria-live="polite"></div>
    </div>
  </div>
</section>

<div id="app" class="hidden">
<header class="topbar"><div class="brand">Atelier</div><button id="profileName" class="profile-pill"></button></header>
<main id="content" class="content"></main>
<nav class="bottom-nav" aria-label="Navegación principal">
<button class="nav-btn active" data-view="wardrobe"><span>◇</span>Armario</button>
<button class="nav-btn" data-view="stylist"><span>✦</span>Estilista</button>
<button class="nav-btn" data-view="shopping"><span>♡</span>Compras</button>
<button class="nav-btn" data-view="insights"><span>▥</span>Análisis</button>
<button class="nav-btn" data-view="settings"><span>○</span>Ajustes</button>
</nav>
</div>

<div id="garmentSheet" class="overlay hidden">
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="garmentTitle">
<form id="garmentForm">
<div class="section-head"><h2 id="garmentTitle">Nueva prenda</h2><button type="button" id="closeGarment" class="secondary">Cerrar</button></div>
<input type="hidden" id="garmentId">
<div class="field"><label for="garmentImage">Foto de la prenda (obligatoria)</label><input id="garmentImage" type="file" accept="image/*"><img id="garmentPreview" class="garment-preview hidden" alt="Vista previa de la prenda"><button id="analyzeBtn" type="button" class="secondary">✨ Analizar foto</button></div>
<div class="field"><label for="garmentName">Nombre</label><input id="garmentName" maxlength="80" required></div>
<div class="field"><label for="garmentCategory">Categoría</label><select id="garmentCategory"><option value="">Sin categoría</option><option>Arriba</option><option>Abajo</option><option>Vestidos</option><option>Capas</option><option>Zapatos</option><option>Bolsos</option><option>Accesorios</option></select></div>
<div class="field"><label for="garmentColor">Color</label><input id="garmentColor" maxlength="60"></div>
<div class="field"><label for="garmentSeason">Temporada</label><select id="garmentSeason"><option value="all">Todo el año</option><option value="warm">Primavera / verano</option><option value="cold">Otoño / invierno</option></select></div>
<div class="field"><label for="garmentStyle">Estilo</label><select id="garmentStyle"><option value="">Sin definir</option><option value="casual">Casual</option><option value="smart">Arreglado</option><option value="party">Fiesta</option><option value="sport">Deporte</option></select></div>
<div class="field"><label for="garmentPrice">Precio de compra (€)</label><input id="garmentPrice" type="number" min="0" max="100000" step="0.01" inputmode="decimal"></div>
<div class="field"><label for="garmentBought">Fecha de compra (opcional)</label><input id="garmentBought" type="date"></div>
<label class="switch-line"><input type="checkbox" id="garmentFavorite"> Añadir a favoritos ♡</label>
<div class="field"><label for="garmentNotes">Notas</label><textarea id="garmentNotes" rows="3" maxlength="500"></textarea></div>
<div class="actions"><button id="deleteGarment" type="button" class="danger hidden">Eliminar</button><button type="submit" class="primary">Guardar</button></div>
</form>
</section>
</div>

<div id="lookSheet" class="overlay hidden">
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="lookTitle">
<form id="lookForm">
<div class="section-head"><h2 id="lookTitle">Nuevo look</h2><button type="button" id="closeLook" class="secondary">Cerrar</button></div>
<input type="hidden" id="lookId">
<div class="field"><label for="lookName">Nombre</label><input id="lookName" maxlength="80" required></div>
<div class="field"><label>Prendas</label><div id="lookGarments"></div></div>
<div class="field"><label for="lookOccasion">Ocasión</label><select id="lookOccasion"><option value="daily">Día a día</option><option value="work">Trabajo</option><option value="dinner">Cena</option><option value="event">Evento</option><option value="travel">Viaje</option></select></div>
<label class="switch-line"><input type="checkbox" id="lookFavorite"> Look favorito ♡</label>
<div class="actions"><button id="deleteLook" type="button" class="danger hidden">Eliminar</button><button type="submit" class="primary">Guardar look</button></div>
</form>
</section>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<noscript>Atelier necesita JavaScript para funcionar.</noscript>
</body>
</html>
