<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ec;color:#171717}

<body>
<div id="loading"><div class="card"><h2>Atelier</h2><p>Cargando tu armario…</p><small>La primera carga puede tardar unos segundos.</small></div></div>
<script>
(async()=>{
  try{
    const names=["chunk00.txt","chunk01.txt","chunk02.txt","chunk03.txt","chunk04.txt","chunk05.txt"];
    const parts=await Promise.all(names.map(n=>fetch(n,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n);return r.text();})));
    const b64=parts.join("").trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    let html=await new Response(stream).text();

    const gateHtml=`
<div id="profileGate" class="profile-gate" hidden>
  <div class="profile-gate-card">
    <span class="eyebrow">ATELIER</span>
    <h1>¿Quién va a usar el armario?</h1>
    <p class="meta">Cada perfil tiene sus propias prendas, looks, favoritos, wishlist e historial.</p>
    <div id="profileChoices" class="profile-choices"></div>
    <div id="profilePasswordBox" class="profile-password-box" hidden>
      <button id="profileBackBtn" class="profile-back" type="button">← Volver</button>
      <div class="profile-selected" id="profileSelectedName"></div>
      <p id="profilePasswordHelp" class="meta"></p>
      <label for="profilePasswordInput">Contraseña</label>
      <div class="profile-password-row">
        <input id="profilePasswordInput" type="password" autocomplete="current-password" placeholder="Introduce la contraseña">
        <button id="profilePasswordToggle" type="button" aria-label="Mostrar contraseña">Ver</button>
      </div>
      <button id="profileUnlockBtn" class="profile-unlock" type="button">Entrar en el armario</button>
      <p id="profilePasswordError" class="profile-password-error" hidden></p>
    </div>
  </div>
</div>`;
    html=html.replace("<body>","<body>"+gateHtml);

    const profileCss=`
.profile-gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:rgba(244,241,236,.96);backdrop-filter:blur(16px)}
.profile-gate[hidden]{display:none}
.profile-gate-card{width:min(100%,460px);background:#fffdf9;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 22px 70px rgba(30,24,17,.12)}
.profile-gate-card h1{margin:6px 0 8px}.profile-choices{display:grid;gap:12px;margin-top:20px}
.profile-choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer}
.profile-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#171717;color:#fff;font-weight:800;flex:0 0 auto}
.profile-choice strong{display:block}.profile-choice small{display:block;color:var(--muted);margin-top:2px}
.profile-switch-button{position:fixed;top:14px;right:14px;z-index:80;border:1px solid var(--line);background:#fffdf9;border-radius:999px;padding:6px 10px 6px 6px;display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.profile-switch-button .pi{width:28px;height:28px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-size:12px}
.profile-password-box{margin-top:18px}.profile-password-box[hidden]{display:none}
.profile-back{border:0;background:transparent;padding:0;margin-bottom:16px;font-weight:700;cursor:pointer}
.profile-selected{font-size:22px;font-weight:800;margin-bottom:8px}
.profile-password-box label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
.profile-password-row{display:flex;gap:8px}
.profile-password-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;background:#fff}
.profile-password-row button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 14px;font-weight:700}
.profile-unlock{width:100%;margin-top:12px;border:0;border-radius:14px;background:#171717;color:#fff;padding:14px 16px;font-weight:800;font:inherit}
.profile-password-error{color:#a22626;font-weight:700;font-size:13px;margin:10px 0 0}
`;
    html=html.replace("</style>",profileCss+"</style>");

    html=html.replace("<main",'<button class="profile-switch-button" id="profileSwitchBtn" type="button"><span class="pi" id="activeProfileInitial">N</span><span id="activeProfileName">Noelia</span></button><main');

    const profileJs=`
const PROFILES=[{id:"noelia",name:"Noelia"},{id:"ana-maria",name:"Ana María"},{id:"irene",name:"Irene"}];
let activeProfileId="";
let pendingProfileId="";
let lastActivityAt=Date.now();
let backgroundAt=0;
const AUTO_LOCK_MS=10*60*1000;
const BACKGROUND_LOCK_MS=60*1000;
const MAX_ATTEMPTS=5;
const LOCKOUT_MS=5*60*1000;
const PBKDF2_ITERATIONS=210000;

function profileStateKey(id){return "state:"+id}
function passwordKey(id){return "atelier-profile-password:"+id}
function securityKey(id){return "atelier-profile-security:"+id}
function getActiveProfile(){return PROFILES.find(p=>p.id===activeProfileId)||PROFILES[0]}

function bytesToHex(bytes){return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("")}
function hexToBytes(hex){const out=new Uint8Array(hex.length/2);for(let i=0;i<out.length;i++)out[i]=parseInt(hex.slice(i*2,i*2+2),16);return out}
function randomHex(len=16){const b=new Uint8Array(len);crypto.getRandomValues(b);return bytesToHex(b)}

async function sha256(value){
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));
  return bytesToHex(new Uint8Array(digest));
}
async function derivePassword(value,saltHex,iterations=PBKDF2_ITERATIONS){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(value),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hexToBytes(saltHex),iterations},key,256);
  return bytesToHex(new Uint8Array(bits));
}
async function createPasswordRecord(value){
  const salt=randomHex(16);
  const hash=await derivePassword(value,salt,PBKDF2_ITERATIONS);
  return "pbkdf2$"+PBKDF2_ITERATIONS+"$"+salt+"$"+hash;
}
async function verifyPassword(value,record){
  if(!record)return {ok:false,migrate:false};
  if(/^[a-f0-9]{64}$/i.test(record)){
    return {ok:(await sha256(value))===record,migrate:true};
  }
  const parts=record.split("$");
  if(parts.length!==4||parts[0]!=="pbkdf2")return {ok:false,migrate:false};
  const iterations=Number(parts[1]),salt=parts[2],expected=parts[3];
  const actual=await derivePassword(value,salt,iterations);
  return {ok:actual===expected,migrate:false};
}
function readSecurity(id){
  try{return JSON.parse(localStorage.getItem(securityKey(id))||"{}")}catch{return {}}
}
function writeSecurity(id,v){localStorage.setItem(securityKey(id),JSON.stringify(v))}
function getLockRemaining(id){
  const s=readSecurity(id),until=Number(s.lockedUntil||0);
  return Math.max(0,until-Date.now());
}
function recordFailure(id){
  const s=readSecurity(id);
  const attempts=(Number(s.attempts)||0)+1;
  if(attempts>=MAX_ATTEMPTS){writeSecurity(id,{attempts:0,lockedUntil:Date.now()+LOCKOUT_MS});return true}
  writeSecurity(id,{attempts,lockedUntil:0});return false;
}
function clearFailures(id){writeSecurity(id,{attempts:0,lockedUntil:0})}
function formatWait(ms){const m=Math.ceil(ms/60000);return m<=1?"1 minuto":m+" minutos"}

function updateProfileUI(){
  const p=getActiveProfile(),n=document.getElementById("activeProfileName"),i=document.getElementById("activeProfileInitial");
  if(n)n.textContent=p.name;if(i)i.textContent=(p.name[0]||"?").toUpperCase()
}
function resetPasswordView(){
  pendingProfileId="";
  const box=document.getElementById("profilePasswordBox"),choices=document.getElementById("profileChoices"),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError");
  if(box)box.hidden=true;if(choices)choices.hidden=false;
  if(input){input.value="";input.type="password";input.autocomplete="current-password"}
  if(err)err.hidden=true
}
function renderProfileChoices(){
  const w=document.getElementById("profileChoices");if(!w)return;
  w.hidden=false;
  w.innerHTML=PROFILES.map(p=>'<button type="button" class="profile-choice" data-profile="'+p.id+'"><span class="profile-avatar">'+p.name[0].toUpperCase()+'</span><span><strong>'+p.name+'</strong><small>Armario privado de '+p.name+'</small></span></button>').join("");
  w.querySelectorAll("[data-profile]").forEach(b=>b.addEventListener("click",()=>requestProfilePassword(b.dataset.profile)))
}
function showProfileGate(){
  activeProfileId="";
  resetPasswordView();renderProfileChoices();
  document.getElementById("profileGate")?.removeAttribute("hidden")
}
function lockAtelier(){
  if(!activeProfileId)return;
  activeProfileId="";
  try{state=defaultState?defaultState():state}catch(e){}
  showProfileGate()
}
function requestProfilePassword(id){
  const p=PROFILES.find(x=>x.id===id);if(!p)return;
  pendingProfileId=id;
  const choices=document.getElementById("profileChoices"),box=document.getElementById("profilePasswordBox"),name=document.getElementById("profileSelectedName"),input=document.getElementById("profilePasswordInput"),help=document.getElementById("profilePasswordHelp"),btn=document.getElementById("profileUnlockBtn"),err=document.getElementById("profilePasswordError");
  const configured=!!localStorage.getItem(passwordKey(id));
  const remaining=getLockRemaining(id);
  if(choices)choices.hidden=true;if(box)box.hidden=false;if(name)name.textContent=p.name;
  if(help)help.textContent=configured?"Introduce la contraseña para acceder.":"Primera vez en este dispositivo: crea la contraseña de este perfil.";
  if(btn){btn.textContent=configured?"Entrar en el armario":"Guardar contraseña y entrar";btn.disabled=remaining>0}
  if(err){
    if(remaining>0){err.textContent="Demasiados intentos. Vuelve a intentarlo en "+formatWait(remaining)+".";err.hidden=false}else err.hidden=true
  }
  if(input){input.value="";input.disabled=remaining>0;setTimeout(()=>{if(!input.disabled)input.focus()},50)}
}
async function unlockProfile(){
  const p=PROFILES.find(x=>x.id===pendingProfileId),input=document.getElementById("profilePasswordInput"),err=document.getElementById("profilePasswordError"),btn=document.getElementById("profileUnlockBtn");
  if(!p||!input)return;
  const remaining=getLockRemaining(p.id);
  if(remaining>0){
    if(err){err.textContent="Demasiados intentos. Vuelve a intentarlo en "+formatWait(remaining)+".";err.hidden=false}
    return;
  }
  const value=input.value;
  if(value.length<4){if(err){err.textContent="La contraseña debe tener al menos 4 caracteres.";err.hidden=false}return}
  if(btn)btn.disabled=true;
  try{
    const key=passwordKey(p.id),saved=localStorage.getItem(key);
    if(!saved){
      localStorage.setItem(key,await createPasswordRecord(value));
      clearFailures(p.id);
    }else{
      const result=await verifyPassword(value,saved);
      if(!result.ok){
        const locked=recordFailure(p.id);
        if(err){err.textContent=locked?"Demasiados intentos. El perfil queda bloqueado durante 5 minutos.":"Contraseña incorrecta.";err.hidden=false}
        input.value="";input.focus();return;
      }
      if(result.migrate)localStorage.setItem(key,await createPasswordRecord(value));
      clearFailures(p.id);
    }
    activeProfileId=p.id;
    lastActivityAt=Date.now();
    state=await loadStateAsync();updateProfileUI();
    document.getElementById("profileGate")?.setAttribute("hidden","");
    input.value="";
    renderAll();renderWishlistSaved();renderAnalytics();try{renderSavedOutfits()}catch(e){}
  }finally{if(btn)btn.disabled=false}
}

["pointerdown","touchstart","keydown","scroll"].forEach(evt=>document.addEventListener(evt,()=>{lastActivityAt=Date.now()},{passive:true}));
setInterval(()=>{if(activeProfileId&&Date.now()-lastActivityAt>AUTO_LOCK_MS)lockAtelier()},30000);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){backgroundAt=Date.now()}
  else if(activeProfileId&&backgroundAt&&Date.now()-backgroundAt>BACKGROUND_LOCK_MS){lockAtelier()}
});
window.addEventListener("pageshow",e=>{if(e.persisted)lockAtelier()});

document.addEventListener("click",e=>{
  if(e.target.closest("#profileSwitchBtn"))showProfileGate();
  if(e.target.closest("#profileBackBtn"))resetPasswordView();
  if(e.target.closest("#profileUnlockBtn"))unlockProfile();
  if(e.target.closest("#profilePasswordToggle")){
    const i=document.getElementById("profilePasswordInput");
    if(i){i.type=i.type==="password"?"text":"password";e.target.textContent=i.type==="password"?"Ver":"Ocultar"}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement?.id==="profilePasswordInput")unlockProfile()});
`;
    html=html.replace('const DB_NAME = "atelier-armario-db";',profileJs+'const DB_NAME = "atelier-armario-db";');
    html=html.replace('idbGet("state")','idbGet(profileStateKey(activeProfileId))');
    html=html.replaceAll('idbSet("state",state)','idbSet(profileStateKey(activeProfileId),state)');
    html=html.replace('const legacy=localStorage.getItem(STORAGE_KEY);','const legacy=(activeProfileId==="noelia")?localStorage.getItem(STORAGE_KEY):null;');
    html=html.replace('idbSet("state",migrated)','idbSet(profileStateKey(activeProfileId),migrated)');

    html=html.replace(
`async function bootstrapApp(){
  state = await loadStateAsync();
  renderAll();
  renderWishlistSaved();
  renderAnalytics();
}`,
`async function bootstrapApp(){
  renderProfileChoices();
  showProfileGate();
}`
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById("loading").innerHTML='<div class="card"><h2>No he podido abrir Atelier</h2><p>Recarga la página. Si sigue ocurriendo, falta alguno de los archivos de la aplicación.</p></div>';
  }
})();
</script>
